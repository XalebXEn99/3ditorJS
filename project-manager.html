<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3ditorJS Project Manager</title>
  </head>
  <body>
    <main id="project-manager-app">
      <header class="project-manager-header">
        <div>
          <p class="project-kicker">3ditorJS</p>
          <h1>Projects</h1>
          <p class="project-subtitle">Create or open a Three.js workspace.</p>
        </div>
        <a href="/">Open editor</a>
      </header>
      <section class="project-manager-layout">
        <section class="project-create-panel">
          <p class="project-kicker">New workspace</p>
          <h2>Start a project</h2>
          <label>Project name <input id="project-name" type="text" value="My Three.js Project"></label>
          <button id="create-project" type="button">Create browser project</button>
          <button id="open-folder" type="button">Open local folder</button>
          <p id="project-manager-status" role="status"></p>
        </section>
        <section class="recent-projects-section">
          <div class="section-heading-row">
            <div>
              <p class="project-kicker">Workspace library</p>
              <h2>Recent projects</h2>
            </div>
            <button id="refresh-projects" type="button" aria-label="Refresh recent projects" title="Refresh recent projects">↻</button>
          </div>
          <div id="recent-projects" class="recent-projects"></div>
        </section>
      </section>
    </main>
    <script type="module" src="/src/projectManagerPage.js"></script>
  </body>
</html>
